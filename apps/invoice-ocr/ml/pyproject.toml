[project]
name = "sjmj-ai-invoice-ocr-ml"
version = "0.1.0"
description = "sjmj-ai invoice-ocr SP1 — OCR PoC 숫자 수직 슬라이스 (오프라인 CLI)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pillow>=10.0",
]

[project.optional-dependencies]
ml = [
    "paddleocr>=3.0",
    "paddlepaddle>=3.0",
    "paddlex[ocr]>=3.4",
    "numpy>=1.26",
]
worker = [
    "sqlalchemy>=2.0",
    "pymysql>=1.1",
]
# CI·로컬 테스트 전용 — compute_metrics(cv2 글루) 단위테스트를 CI에서 돌리기 위한 경량 조합.
# 워커 런타임 의존 추가가 아니다(운영 venv엔 cv2·numpy가 이미 있고 CD는 uv sync를 하지 않는다).
# 상한 <5: 운영 워커의 cv2가 4.x이므로 major를 맞춘다. 무상한이면 5.0.0.93이 잡혀
# 임계를 재는 환경(4.x)과 회귀를 막는 환경(5.x)이 갈린다. 단 <5는 4.13을 주므로
# 4.10 '동일 버전'이 아니라 major 정합까지만 보장한다(정확한 워커 버전은 Task 7에서 기록).
# numpy도 <3 상한: cv2와 동일하게 major 정합까지만 보장한다(1.26~2.x는 허용, 3.x부터 차단).
# 워커 numpy도 2.x(2.5.0, Task 7 실측)라 이 상한이 1.x를 강제하는 것은 아니다 — 무상한이면
# cv2처럼 향후 3.x가 미리 잡혀 워커와 테스트 환경의 산술(NEP 50 등)이 갈릴 위험을 막는다.
cv = [
    "opencv-python-headless>=4.10,<5",
    "numpy>=1.26,<3",
]
# 로컬 검증·워커 런타임 전용 — DL 코너검출(DocAligner point/lcnet050) ONNX 추론.
# CI는 이 extra 없이 돈다(worker+cv): corner_dl의 onnxruntime import가 _make_session 안으로
# 지연돼 있고 단위테스트는 Fake 세션을 쓴다.
# ==1.22.0 핀: 2026-08-12 스파이크가 검증한 버전이며, 배포 단계의 worker venv 수동 설치도
# 같은 버전을 쓴다. ml(paddle)과 conflicts는 추가하지 않는다 — CPU ONNX 추론이라 cv2
# 네임스페이스가 겹치지 않는다.
# ⚠️ 단독 사용 불가 — corner_dl은 모듈 레벨에서 cv2·numpy를 import하므로 `uv sync --extra dl`만
# 돌리면 `import handwriting.corner_dl`이 ModuleNotFoundError(cv2)로 죽는다. 항상 cv(또는
# paddlex 경유로 cv2를 끌어오는 ml)와 함께 동기화한다: `uv sync --extra worker --extra cv --extra dl`.
# 여기에 opencv/numpy를 직접 넣지 않는 이유는 위 [tool.uv].conflicts의 cv2 이중설치 회피 규약이다.
dl = [
    "onnxruntime==1.22.0",
]
# 학습 전용(#133 AC2 학습곡선 · 이후 AC3 재학습) — CI는 이 extra 없이 돈다.
# 실험계획·채점은 torch-free 모듈 tools/train_input.py에 있어 CI가 그쪽을 테스트하고,
# handwriting/train_contrastive.py는 로컬(M5 Max MPS)·macmini에서만 실행된다.
# 상한은 로컬 .venv 실측치의 minor에 고정한다(2026-08-28: torch 2.12.1 · torchvision
# 0.27.1 · transformers 5.12.1) — 학습 환경이 ft_prod.pt를 적재하는 추론 환경과 갈리면
# state_dict 정합·transformers ViT 레이어 접근(vit.layers[i], 5.x API)이 조용히 흔들린다.
# cv와 함께 동기화한다: `uv sync --extra train --extra cv`.
train = [
    "torch>=2.12,<2.13",
    "torchvision>=0.27,<0.28",
    "transformers>=5.12,<5.13",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    # npz IO 단위테스트 전용 — 운영 뱅크를 직접 쓰는 경로라 합성 npz로 검증한다.
    # 코어 런타임 의존성(pillow-only)에는 추가하지 않는다(paddle-free 규약).
    "numpy>=1.26",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
# ml(paddle 계열)과 cv(opencv-headless)는 동시 설치 금지 — opencv-contrib-python(paddlex 경유)과
# opencv-python-headless가 같은 cv2/ 네임스페이스에 겹쳐 설치된다(OpenCV 공식 비권장).
# uv가 이 조합을 hard fail로 강제한다(uv 0.8.8 실측: worker+cv는 정상, ml+cv는 거부).
conflicts = [[{ extra = "ml" }, { extra = "cv" }]]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# PLW1514(unspecified-encoding)가 preview 게이트라 lint 한정으로 preview를 켠다.
# [tool.ruff] 전역 preview는 금지 — formatter preview가 15개 파일을 재포맷해
# `format --check`를 깨뜨린다(실측). lint preview는 현재 select 조합에서 신규 위반 0건.
preview = true
# Google pyguide 핵심 lint 룰 — 도구가 강제 가능한 부분만.
# E/W: pycodestyle errors/warnings (PEP 8)
# F:   pyflakes (사용 안 한 import, undefined name 등)
# N:   pep8-naming (snake_case 함수/변수, PascalCase 클래스, UPPER_CASE 상수)
# UP:  pyupgrade (오래된 문법 → 모던 문법)
# B:   flake8-bugbear (흔한 버그 패턴)
# SIM: flake8-simplify (단순화 가능한 코드)
# I:   isort (import 정렬)
# D:   pydocstyle (docstring) — google convention
# PLW1514: 텍스트 파일 I/O의 encoding= 누락(AST 가드 tests/test_encoding_guard.py의
#          부분집합 — 에디터 인라인 피드백용 보조이지 계약이 아니다)
select = ["E", "W", "F", "N", "UP", "B", "SIM", "I", "D", "PLW1514"]
ignore = [
  "D100", # 모듈 docstring 누락 — 너무 빡빡
  "D104", # 패키지 docstring 누락
  "E501", # 줄 길이 (포매터가 처리)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D", "N802", "PLW1514"]  # N802: test_..._금액_synonym 한글 테스트명 오탐, PLW1514: tests는 범위 밖(spec §4)
"tools/**" = ["D"]  # tools/는 환경/검출 스파이크 — docstring 강제 제외
"__init__.py" = ["F401"]
# handwriting/는 배포된 ml-worker(worker.main)가 import해 도는 추론 코드(실험 아님).
# 단, 단일 대문자 행렬·기하 변수(M/A/P/E…)와 torch 관용 별칭(F=nn.functional,
# T=transforms.v2)은 과학/CV Python 표준(PEP8 수학표기 허용)이라 naming만 면제한다.
"handwriting/**" = ["N803", "N806", "N812"]
