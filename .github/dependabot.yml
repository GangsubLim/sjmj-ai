# Dependabot version updates — devel 타깃·cooldown 7일·major 제외 (spec §6.4)
#
# security update는 GitHub 고정 동작으로 항상 default branch(main) 대상이며 target-branch가
# 지정된 entry의 옵션(cooldown 포함)이 적용되지 않는다. 그 경로의 방어는 PR CI의 freshness
# 게이트(scripts/lockfile_freshness.py)가 담당한다.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "devel"
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/apps/invoice-ocr/frontend"
    schedule:
      interval: "weekly"
    target-branch: "devel"
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "uv"
    directory: "/apps/invoice-ocr/backend"
    schedule:
      interval: "weekly"
    target-branch: "devel"
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "uv"
    directory: "/apps/invoice-ocr/ml"
    schedule:
      interval: "weekly"
    target-branch: "devel"
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # dl extra의 onnxruntime은 2026-08-12 스파이크가 검증한 의도적 정확핀(==1.22.0)이며
      # tests/test_train_extra.py가 단언한다 — bump PR은 항상 CI RED라 상시 제외한다.
      # 핀 상향은 DL 코너검출 경로 재활성화(#118) 시 스파이크 재검증과 함께 수동으로 한다.
      - dependency-name: "onnxruntime"
        update-types:
          ["version-update:semver-minor", "version-update:semver-patch"]
