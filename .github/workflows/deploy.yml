name: Deploy sjmj-ai to Mac mini

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      skip_supply_chain_gate:
        description: "공급망 freshness 게이트 우회(registry 장애 등 긴급용)"
        type: boolean
        default: false

# self-hosted 러너의 토큰 스코프를 최소화한다 — 배포는 git fetch와 로컬 실행만 한다.
permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, macmini]
    defaults:
      run:
        working-directory: /Users/submini/sjmj-ai

    env:
      SJMJ_ENV_FILE: /Users/submini/.sjmj-ai/backend.env
      HEALTH_URL: http://127.0.0.1:8400/health
      BACKEND_DIR: apps/invoice-ocr/backend
      FRONTEND_DIR: apps/invoice-ocr/frontend
      ML_WORKER_ENV_FILE: /Users/submini/.sjmj-ai/ml-worker.env
      ML_WORKER_LABEL: ai.sjmj.ml-worker
      SJMJ_PENDING_BASE_FILE: /Users/submini/.sjmj-ai/supply-chain-pending-base

    steps:
      - name: Record previous commit
        id: previous
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Fetch target ref
        run: git fetch --tags --force origin

      - name: Checkout target
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            git checkout --force "${GITHUB_REF_NAME}"
          else
            git checkout --force "${GITHUB_SHA}"
          fi

      # 설치 이전 차단이 이 step의 존재 이유다 — uv sync의 sdist setup.py와 npm ci의
      # lifecycle script는 실행 그 자체가 침해 시점이라 설치 후 차단은 방어가 아니다.
      # base는 직전 배포 커밋이라 릴리스 사이클 동안 쌓인 정상 bump는 fresh로 잡히지 않고,
      # 사실상 exotic·unverifiable만 재확인하는 형태가 된다(구조적 오검출 없음).
      # skip 입력을 not/and로 비교하면 문자열 "false"도 참으로 평가돼 게이트가 스킵될 수
      # 있어, 불리언 리터럴과의 명시 비교(!= true / == true)로 fail-closed를 보장한다.
      - name: Supply-chain freshness gate (pre-install)
        id: gate
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.skip_supply_chain_gate != true }}
        timeout-minutes: 10
        env:
          PREV: ${{ steps.previous.outputs.sha }}
        run: |
          set -euo pipefail
          [[ -n "$PREV" ]] || { echo "missing previous sha; cannot gate" >&2; exit 1; }
          BASE="$PREV"
          if [[ -s "$SJMJ_PENDING_BASE_FILE" ]]; then
            # 직전 우회 배포가 남긴 base로 소급 검사한다 — 우회 구간 전체가 검사에 포함된다.
            BASE="$(head -n 1 "$SJMJ_PENDING_BASE_FILE")"
            echo "pending base 소급 검사: $BASE"
          fi
          python3 scripts/lockfile_freshness.py --base "$BASE"
          # pending 삭제는 여기서 하지 않는다 — 게이트 통과 뒤 설치·헬스에서 실패해 이전 SHA로
          # 롤백되면 검사되지 않은 우회 구간이 운영에 남은 채 기록만 사라진다.
          echo "checked=true" >> "$GITHUB_OUTPUT"

      - name: Record bypassed gate base
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_supply_chain_gate == true }}
        env:
          PREV: ${{ steps.previous.outputs.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$SJMJ_PENDING_BASE_FILE")"
          if [[ -s "$SJMJ_PENDING_BASE_FILE" ]]; then
            # 연속 우회에서는 가장 오래된 base를 유지한다 — 덮으면 우회 구간이 검사에서 빠진다.
            echo "pending base 유지: $(head -n 1 "$SJMJ_PENDING_BASE_FILE")"
          else
            printf '%s\n' "$PREV" > "$SJMJ_PENDING_BASE_FILE"
            echo "게이트 우회 — 다음 정상 배포가 소급 검사할 base 기록: $PREV"
          fi

      # 롤백 범위 분리의 기준점 — 이 마커 이전 실패(게이트·체크아웃)는 작업트리 복원만 하고
      # 실행 중인 backend·ml-worker를 건드리지 않는다.
      - name: Mark install phase entered
        id: phase
        run: echo "entered=true" >> "$GITHUB_OUTPUT"

      - name: Backup operational DB
        run: |
          set -euo pipefail
          chmod +x scripts/backup-db.sh
          SJMJ_ENV_FILE="$SJMJ_ENV_FILE" scripts/backup-db.sh

      - name: Apply DB migrations
        run: |
          set -euo pipefail
          chmod +x scripts/migrate-db.sh
          SJMJ_ENV_FILE="$SJMJ_ENV_FILE" scripts/migrate-db.sh

      - name: Backend deps + import smoke
        run: |
          set -euo pipefail
          cd "$BACKEND_DIR"
          uv sync --frozen
          uv run python -c "from app.main import app; assert app"

      - name: Build frontend
        run: |
          set -euo pipefail
          cd "$FRONTEND_DIR"
          npm ci
          # 콘텐츠 해시 청크를 지우지 않는다 — 배포 전에 열려 있던 탭이 아직 요청하지 않은
          # 옛 page-*.js / jspdf 청크를 404 없이 받게 한다(설정을 소스에 두면 롤백 빌드가
          # 이전 SHA를 체크아웃해 설정이 사라지므로 배포 스텝에서 강제한다).
          # 이 플래그가 보존 불변식의 정본이다 — 운영 머신에서 `make build`나 맨
          # `npm run build`를 돌리면 dist가 비워져 보존해 둔 옛 청크가 사라진다(다음 배포까지 404).
          npm run build -- --no-emptyOutDir

      - name: Restart LaunchAgent
        run: |
          set -euo pipefail
          chmod +x scripts/run-backend.sh scripts/install-launchagent.sh
          SJMJ_ENV_FILE="$SJMJ_ENV_FILE" scripts/install-launchagent.sh

      - name: Health check
        run: |
          set -euo pipefail
          ok=0
          for _ in $(seq 1 30); do
            if curl -fsS "$HEALTH_URL"; then echo "health ok"; ok=1; break; fi
            sleep 2
          done
          [[ "$ok" == "1" ]] || { echo "health check failed: $HEALTH_URL" >&2; exit 1; }

      - name: Restart ml-worker
        run: |
          set -euo pipefail
          # ml-worker는 장기 실행 프로세스(worker.main)라 시작 시 infer_job/모델을
          # 1회 import해 메모리에 캐시한다. git checkout이 디스크 코드를 갱신해도
          # 재시작 전까지 옛 코드를 계속 실행하므로 배포마다 재시작이 필수다.
          # ml venv(.venv)는 package=false로 의존성을 수동 핀했으므로 uv sync 하지 않는다
          # (소스는 cwd에서 import → 재시작이 새 코드를 로드). 의존성 변경은 별도 수동 절차.
          chmod +x scripts/run-ml-worker.sh scripts/install-launchagent-ml-worker.sh
          SJMJ_ENV_FILE="$ML_WORKER_ENV_FILE" scripts/install-launchagent-ml-worker.sh

      - name: ml-worker liveness
        run: |
          set -euo pipefail
          GUI="gui/$(id -u)/$ML_WORKER_LABEL"
          status() { launchctl print "$GUI" 2>/dev/null; }
          pid_of() { status | awk -F= '/[^a-z]pid =/{gsub(/ /,"",$2);print $2;exit}'; }
          state_of() { status | awk -F'= ' '/[^a-z]state =/{print $2;exit}'; }
          # 모델 재적재(수십초)가 끝나길 기다리지 않는다 — 즉시 크래시(KeepAlive 재기동 루프)만 잡는다.
          sleep 3
          pid1=$(pid_of); st1=$(state_of)
          [[ "$st1" == "running" && -n "$pid1" ]] \
            || { echo "ml-worker not running after start (state=$st1 pid=$pid1)" >&2; status | grep -E "state|pid|last exit" >&2 || true; exit 1; }
          # 10초 뒤 같은 pid가 살아 있어야 한다(크래시 시 KeepAlive가 새 pid로 재기동).
          sleep 10
          pid2=$(pid_of); st2=$(state_of)
          [[ "$st2" == "running" && "$pid2" == "$pid1" ]] \
            || { echo "ml-worker unstable (pid $pid1 -> $pid2, state=$st2) — likely crash loop" >&2; status | grep -E "state|pid|last exit" >&2 || true; exit 1; }
          echo "ml-worker healthy: pid $pid2 stable, state running"

      - name: Clear pending gate base
        # 소급 검사 의무 해제는 배포가 실제로 끝난 뒤다. 우회 배포는 게이트가 skip돼
        # steps.gate.outputs.checked가 비므로 방금 기록한 pending이 지워지지 않는다.
        if: ${{ success() && steps.gate.outputs.checked == 'true' }}
        run: rm -f "$SJMJ_PENDING_BASE_FILE"

      - name: Restore checkout on pre-install failure
        # failure()는 취소 상태를 포함하지 않는다 — 취소로 빠지면 운영 체크아웃에 미검증
        # target SHA가 남고 다음 배포가 그 SHA를 base로 기록해 그 사이 유입분이 영구 누락된다.
        if: ${{ (failure() || cancelled()) && steps.phase.outputs.entered != 'true' }}
        env:
          PREV: ${{ steps.previous.outputs.sha }}
        run: |
          set -euo pipefail
          [[ -n "$PREV" ]] || { echo "missing previous sha; cannot restore" >&2; exit 1; }
          git checkout --force "$PREV"

      - name: Rollback on failure
        # 설치·빌드·재시작에 진입한 뒤의 실패만 전체 롤백을 돈다.
        if: ${{ failure() && steps.phase.outputs.entered == 'true' }}
        env:
          # run 블록 안의 ${{ }} 보간은 zizmor template-injection 대상 — env로 넘긴다.
          PREV: ${{ steps.previous.outputs.sha }}
        run: |
          set -euo pipefail
          [[ -n "$PREV" ]] || { echo "missing previous sha; cannot rollback" >&2; exit 1; }
          git checkout --force "$PREV"
          cd "$BACKEND_DIR" && uv sync --frozen && uv run python -c "from app.main import app; assert app"
          cd /Users/submini/sjmj-ai/"$FRONTEND_DIR"
          npm ci && npm run build -- --no-emptyOutDir
          cd /Users/submini/sjmj-ai
          SJMJ_ENV_FILE="$SJMJ_ENV_FILE" scripts/install-launchagent.sh
          ok=0
          for _ in $(seq 1 30); do
            if curl -fsS "$HEALTH_URL"; then echo "rollback health ok"; ok=1; break; fi
            sleep 2
          done
          [[ "$ok" == "1" ]] || { echo "rollback health check failed" >&2; exit 1; }
          # backend와 버전 정합을 위해 ml-worker도 이전 SHA 코드로 재시작한다.
          # 롤백의 핵심(backend health)은 위에서 끝났으므로 여기 실패가 롤백을 막지 않게 best-effort.
          chmod +x scripts/run-ml-worker.sh scripts/install-launchagent-ml-worker.sh || true
          SJMJ_ENV_FILE="$ML_WORKER_ENV_FILE" scripts/install-launchagent-ml-worker.sh \
            || echo "warn: ml-worker rollback restart failed — restart manually on macmini" >&2
